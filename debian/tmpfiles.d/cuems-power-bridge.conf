#
# Runtime directory for the cluster power-off sequence lock.
#
# The lock is taken by the daemon (User=cuems), by the ExecStop wrapper (root)
# and by the internal helper, so one power-off at a time is true for the
# machine rather than for one process. /run is root-owned, so the daemon could
# not create this directory itself; cuems-common ships no rule for /run/cuems,
# hence this package's own namespace.
d /run/cuems-power-bridge 0770 cuems cuems - -
