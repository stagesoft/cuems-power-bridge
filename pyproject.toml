[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "cuemspowerbridge"
version = "0.3.0"
description = "CUEMS power bridge: Shelly + Companion shutdown coordinator and engine WebSocket client"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = ["Ion Reguera <ion@stagelab.coop>"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: System :: Power (UPS)",
]
repository = "https://github.com/stagesoft/cuems-power-bridge"
homepage = "https://github.com/stagesoft/cuems-power-bridge"

[[tool.poetry.packages]]
include = "cuemspowerbridge"
from = "src"

[tool.poetry.dependencies]
python = "^3.11"
aiohttp = ">=3.9"
websockets = ">=12.0"
python-osc = ">=1.8"
# cuemsutils OWNS network_map.xml and settings.xml: their schemas, their
# vocabulary and the reader this package now uses (feature 001). A real
# runtime dependency, not an extra — and upper-bounded, because a floor alone
# cannot say "refuse a library that has moved past me", which is what the
# release gate needs. Bounded the way cuems-nodeconf bounds its own.
cuemsutils = ">=0.1.0rc16,<0.1.1"
# systemd-python is provided by python3-systemd (see debian/control).

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytest-asyncio = "*"
pytest-mock = "*"

[tool.poetry.scripts]
cuems-power-bridge = "cuemspowerbridge.scripts.power_bridge:main"
cuems-power-bridge-deploy-keys = "cuemspowerbridge.scripts.deploy_keys:main"
cuems-power-bridge-install-mjs = "cuemspowerbridge.scripts.install_shelly_mjs:main"
cuems-power-bridge-test-projector = "cuemspowerbridge.scripts.test_projector:main"
# Read-only query so cuems-common's shell scripts need no Python of ours.
# The cluster power-off helper deliberately has NO console entry: it is
# internal, run as `python -m cuemspowerbridge.scripts.cluster_poweroff`.
cuems-power-bridge-config = "cuemspowerbridge.scripts.config_get:main"
cuems-wsclient = "cuemspowerbridge.wsclient:main_cli"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = ["-v", "-ra", "--strict-markers"]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
